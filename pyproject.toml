[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "binance-signal-bot"
version = "0.1.0"
description = "Alert-first Binance technical and anomaly signal scanner"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
license = { text = "MIT" }
authors = [{ name = "Project contributors" }]
dependencies = [
  "cryptography==46.0.3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "rfc8785==0.1.4",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<17",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.130,<7",
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
signalbot = "signalbot.cli:main"
signalbot-capture = "signalbot.capture.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signalbot"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = ["integrations"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
