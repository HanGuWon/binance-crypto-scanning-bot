  gross_notional_to_nav_max: 1.0
  combined_symbol_notional_to_nav_max: 0.10
  volatility_target_annualized: 0.10
  volatility_estimator: lagged_30d_daily_portfolio_returns
  mark_to_market: executable_BBO

sequential_testing_ladder:
  stage_0_data_and_artifact_qualification:
    pass_requirements:
      - immutable_source_manifest_and_hashes
      - schema_and_timestamp_contract_tests
      - point_in_time_universe_reconstruction
      - r4a_sealed_namespace
      - no_private_or_order_dependencies
    fail_outcome: STOP_ENGINEERING_OR_DATA
  stage_1_mechanism_sanity_exposed_development_only:
    outputs:
      - event_paths
      - pretrend_checks
      - matched_placebos
      - sign_and_unit_invariants
    parameter_changes_after_stage: forbidden
  stage_2_fixed_rule_gross_edge:
    primary_gate: 'one-sided 95% synchronized block-bootstrap lower bound of gross mean > 0'
    failure_action: reject_family_before_machine_learning
  stage_3_executable_replay:
    requirement: next_BBO_depth_walk_fees_and_funding
    missing_required_data_outcome: INCONCLUSIVE_DATA
    proxies_for_missing_execution_data: forbidden
  stage_4_leakage_safe_anchored_walk_forward:
    train_days: 360
    calibration_days: 90
    test_days: 90
    step_days: 90
    synchronized_cross_asset_folds: true
    purge: maximum_label_or_holding_horizon_around_each_boundary
    embargo_bars: 1
    fit_on_prior_data_only:
      - robust_locations_and_scales
      - betas
      - universe_eligibility
      - optional_model
      - probability_calibration
  stage_5_optional_simple_model:
    activation: only_if_fixed_rule_family_is_executable_net_positive
    model: penalized_logistic_regression
    target: positive_executable_net_return
    calibration: isotonic_if_calibration_gates_are_estimable
    model_zoo_or_hyperparameter_sweep: forbidden
    permitted_role: rank_or_abstain_not_rescue_negative_family
  stage_6_portfolio_capacity_and_stress:
    requirement: all_non_overlap_and_execution_sensitivities
  stage_7_prospective_sealed_holdout:
    evaluation_count: one

inference_and_overfitting_controls:
  primary_family_count: 3
  familywise_error_rate: 0.05
  correction: Holm_one_sided_across_A_B_C
  family_B_child_correction: Bonferroni_alpha_0.025
  primary_observation_unit: synchronized_UTC_daily_portfolio_net_PnL
  bootstrap:
    type: circular_moving_block
    repetitions: 50000
    primary_block_days: 7
    sensitivity_block_days:
      - 14
      - 28
    random_seed: 20260717
    quantile_method: linear
  required_backtest_overfitting_diagnostics:
    deflated_sharpe_probability_min: 0.95
    probability_of_backtest_overfitting_max: 0.10
    reality_check: White
    superior_predictive_ability_test: Hansen
    library_scope: every_R4b_variant_attempted_including_failures
  matched_null_conditioning:
    - symbol
    - venue
    - UTC_time_of_week
    - side
    - holding_duration
    - liquidity_and_spread_decile
    - volatility_regime
    - event_cluster
  negative_controls:
