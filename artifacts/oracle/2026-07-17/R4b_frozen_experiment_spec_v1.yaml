protocol:
  id: R4B_CAUSAL_V1
  version: 1.0.0
  status: FROZEN_DRAFT_FOR_EXTERNAL_TIMESTAMPING
  frozen_at: '2026-07-17T11:52:53+09:00'
  project: crypto_trading
  purpose: >-
    Falsify or provisionally support at most three orthogonal closed-5m alert
    mechanisms using executable, point-in-time net returns after fees, slippage,
    depth walking, and futures funding. This protocol does not authorize live orders.
  permitted_modes:
    - historical_replay_when_required_raw_data_exist
    - shadow_alerting
    - paper_execution
  prohibited_modes:
    - private_exchange_endpoints
    - signed_requests
    - live_orders
    - margin_or_leverage_above_1x
    - post_result_threshold_tuning
  claims_forbidden:
    - guaranteed_profit
    - validated_edge_before_all_gates
    - untouched_holdout_claim_from_exposed_history
    - r4b_beats_r4a_without_auditable_r4a_artifacts

r4a_boundary:
  status: SEALED_READ_ONLY
  source_status: USER_STIPULATED_NOT_INDEPENDENTLY_VERIFIED
  stipulated_result:
    event_universe: closed_5m_spot_breakout_long_and_futures_breakdown_short_C0
    out_of_fold_predictions: 52107
    selected_predictions: 0
    maximum_predicted_net_return: negative
  consequences:
    - no_retraining_or_recalibration_on_the_r4a_ledger
    - no_threshold_relaxation_or_feature_addition_on_the_r4a_ledger
    - no_rsi_privilege
    - no_claim_that_a_new_family_is_an_r4a_repair
  artifact_gate: >-
    Raw R4a predictions, labels, folds, code, configuration, costs, feature contract,
    model card, and hashes must be supplied before any independent replication or
    comparative claim is permitted.

research_hypotheses:
  family_A:
    name: derivatives_crowding_to_forced_deleveraging_transition
    primary_null: mean_synchronized_daily_net_return_bps_le_0
  family_B:
    name: order_flow_and_visible_liquidity_dislocation
    primary_null: mean_synchronized_daily_net_return_bps_le_0
    children:
      - depletion_continuation
      - absorption_reversal
  family_C:
    name: cross_sectional_common_shock_lag_catchup
    primary_null: mean_synchronized_daily_net_return_bps_le_0

clock_and_point_in_time_contract:
  bar_interval: 5m
  signal_bars: fully_closed_only
  decision_cutoff: 'bar_close_time + 2000ms'
  base_execution_latency_ms: 250
  admissible_feature_record: >-
    exchange_event_time <= bar_close_time AND local_receipt_time <= decision_cutoff
  entry_rule: >-
    First valid executable opposite-side BBO/depth snapshot received at or after
    decision_cutoff + execution_latency.
  exit_rule: >-
    First valid executable opposite-side BBO/depth snapshot after the first closed
    bar satisfying an exit condition, or after the hard horizon.
  invalid_quote_policy:
    quote_age_ms_max: 2000
    spread_bps_max_for_execution: 20
    crossed_or_locked_book: NON_EXECUTABLE
    sequence_gap: NON_EXECUTABLE
    insufficient_depth: NON_EXECUTABLE
    missing_data: NON_EXECUTABLE
    zero_return_imputation: forbidden
  timestamps_required:
    - exchange_event_time
    - exchange_transaction_time_when_available
    - local_receipt_time
    - persistence_time
  finalization_required: true

universe:
  reconstruction: point_in_time
  refresh_time_utc: '00:00:00'
  spot:
    quote_asset: USDT
    status: TRADING
  futures:
    contract_type: USD_M_LINEAR_PERPETUAL
    margin_asset: USDT
    status: TRADING
  exclusions:
    - stablecoin_or_fiat_base_assets_from_frozen_taxonomy
    - leveraged_tokens
    - inactive_suspended_or_delisting_intervals
    - redenomination_or_contract_migration_intervals_without_explicit_mapping
  minimum_history:
    complete_prior_days: 30
    closed_5m_bars: 8640
  liquidity_floor:
    prior_30d_median_daily_quote_volume_usdt_min: 10000000
    prior_30d_median_spread_bps_max: 10
    prior_30d_spread_bps_p99_max: 50
  capacity_constraints:
    max_fraction_visible_depth_within_10bp: 0.01
    max_fraction_closed_5m_quote_volume: 0.01
  cross_sectional_minimum_symbols: 20
  no_current_top_n_survivor_selection: true

common_feature_definitions:
  robust_zscore:
    id: RZ
    lookback_closed_5m_bars: 8640
    formula: '(x_t - median(x_[t-W,t-1])) / (1.4826 * MAD(x_[t-W,t-1]) + epsilon)'
    current_observation_excluded: true
  log_return: 'r_i,h(t) = ln(close_i,t / close_i,t-h)'
  true_range: 'TR_t = max(high_t-low_t, abs(high_t-close_t-1), abs(low_t-close_t-1))'
  epsilon: 1.0e-12

families:
  A:
    data_required_for_features:
      - closed_5m_klines
      - timestamped_open_interest_or_open_interest_value
      - mark_price
      - index_price
      - mark_price_stream_funding_estimate
      - aggregate_trades_or_individual_trades
    data_required_for_execution:
      - book_ticker
      - sequence_consistent_depth
      - actual_fee_schedule
      - realized_funding_settlements_during_hold
    optional_diagnostic_data:
      - liquidation_force_order_stream
    feature_definitions:
      return_1: 'r1_t = ln(close_t / close_t-1)'
      return_12: 'r12_t = ln(close_t / close_t-12)'
      oi_change_1: 'doi1_t = ln(OI_value_t / OI_value_t-1)'
      oi_change_12: 'doi12_t = ln(OI_value_t / OI_value_t-12)'
      basis: 'basis_t = ln(mark_price_t / index_price_t)'
      aggressive_flow: >-
        flow_t = (aggressive_buy_quote_notional - aggressive_sell_quote_notional) /
        (aggressive_buy_quote_notional + aggressive_sell_quote_notional + epsilon)
      funding_estimate: >-
        Last next-funding estimate published by the mark-price stream and received by
        decision_cutoff; future realized funding history is forbidden as a feature.
      crowd_direction: 'c = sign(r12_t-1)'
    precondition_at_t_minus_1:
      - 'abs(RZ(r12_t-1)) >= 1.5'
      - 'RZ(doi12_t-1) >= 1.5'
      - 'c * RZ(basis_t-1) >= 1.5'
      - 'c * RZ(funding_estimate_t-1) >= 1.0'
    closed_bar_trigger_at_t:
      - 'c * RZ(r1_t) <= -0.5'
      - 'RZ(doi1_t) <= -1.0'
      - 'c * flow_t <= -0.35'
    actions:
      crowded_long_unwind_c_plus_1:
        spot: EXIT_RISK
        futures: SHORT
      crowded_short_unwind_c_minus_1:
        spot: LONG
        futures: LONG
    exits:
      hard_horizon_bars: 12
      normalization:
        condition: 'c * RZ(basis_current) <= 0'
      flow_reversal:
        condition: 'c * flow_current >= 0.20 for 2 consecutive closed bars'
      adverse_invalidation:
        crowded_long_unwind: 'closed_close > max(high_[t-12,t-1])'
        crowded_short_unwind: 'closed_close < min(low_[t-12,t-1])'
    liquidation_use: >-
      Diagnostic causal attribution only. It is not a gate or a complete-volume
      measure because the official all-market liquidation stream is a censored snapshot.

  B:
    data_required_for_features:
      - aggregate_trades_or_individual_trades
      - book_ticker
      - sequence_consistent_depth
    data_required_for_execution:
      - book_ticker
      - sequence_consistent_depth
      - actual_fee_schedule
      - realized_funding_settlements_during_hold_for_futures
    local_book_contract:
      sequence_fields_required:
        - U
        - u
        - pu
      depth_band_bps: 10
      stream_choice: FROZEN_BEFORE_T0
      rpi_treatment: >-
        The chosen standard-depth or RPI-depth stream must be fixed in the manifest;
        visible depth means only venue-published depth available through that stream.
    bar_features:
      aggressive_imbalance: >-
        I_t = (Q_buy_t - Q_sell_t) / (Q_buy_t + Q_sell_t + epsilon), where
        buyer_is_maker=false is aggressive buy and buyer_is_maker=true is aggressive sell.
      mid_return: >-
        r_bar_t = ln(median_BBO_mid_last_5s / median_BBO_mid_first_5s)
      opposing_depth_start: 'median opposing-side visible depth within 10bp during first 30s'
      opposing_depth_low: '5th percentile opposing-side visible depth within 10bp during bar'
      opposing_depth_end: 'median opposing-side visible depth within 10bp during last 30s'
      spread_95: '95th percentile BBO spread in bps during bar'
    child_B1_depletion_continuation:
      trigger:
        - 'abs(RZ(I_t)) >= 2.0'
        - 'sign(I_t) * RZ(r_bar_t) >= 1.0'
        - 'D_low / D_start <= 0.50'
        - 'D_end / D_low < 1.20'
        - 'spread_95 <= 20'
      action: 'direction = sign(I_t)'
    child_B2_absorption_reversal:
      trigger:
        - 'abs(RZ(I_t)) >= 2.0'
        - 'sign(I_t) * RZ(r_bar_t) <= 0.25'
        - 'abs(RZ(r_bar_t)) <= 0.75'
        - 'D_end / D_low >= 1.50'
        - 'spread_95 <= 20'
      action: 'direction = -sign(I_t)'
    direction_mapping:
      positive:
        spot: LONG
        futures: LONG
      negative:
        spot: EXIT_RISK
        futures: SHORT
    exits:
      hard_horizon_bars: 3
      flow_reversal: 'position_sign * I_current <= -0.30 on a closed bar'
      adverse_invalidation: 'close moves against position by 1.0 * event_bar_true_range from entry reference'
    primary_family_portfolio: >-
      Union of B1 and B2 under the common non-overlap policy, with equal ex-ante risk
      budgets. Child-level claims use Bonferroni alpha 0.025.

  C:
    data_required_for_mechanism_screen:
      - point_in_time_closed_5m_klines_for_full_eligible_universe
    data_required_for_executable_net_test:
      - book_ticker
      - sequence_consistent_depth
      - actual_fee_schedule
      - realized_funding_settlements_during_hold_for_futures
    venue_calculation: separate_spot_and_futures_cross_sections
    feature_definitions:
      asset_return_3: 'r_i3_t = ln(close_i,t / close_i,t-3)'
      common_return_3: 'm3_t = cross_sectional_median_i(r_i3_t)'
      lagged_beta: >-
        beta_i,t = clip(Cov(r_i, m) / Var(m), 0.25, 2.5), estimated only from
        the previous 8640 closed bars.
      residual: 'e_i3_t = r_i3_t - beta_i,t * m3_t'
      residual_scale: 'sigma_i,t = 1.4826 * MAD(e_i3 over previous 8640 bars)'
      lag_score: 'L_i,t = sign(m3_t) * (beta_i,t * m3_t - r_i3_t) / (sigma_i,t + epsilon)'
    common_shock_gate:
      - 'abs(m3_t) / robust_scale_30d(m3) >= 2.5'
      - 'same_sign_cross_sectional_breadth >= 0.70'
      - 'eligible_symbols >= 20'
    selection:
      - 'top decile by L_i,t within venue'
      - 'L_i,t >= 1.5'
    actions:
      positive_common_shock:
        spot: LONG
        futures: LONG
      negative_common_shock:
        spot: EXIT_RISK
        futures: SHORT
    frozen_gap_exit_math:
      initial_gap: 'g0 = sign(m3_t) * (beta_i,t * m3_t - r_i3_t)'
      catchup_at_h: >-
        catch_h = sign(m3_t) * (ln(close_i,t+h/close_i,t) -
        beta_i,t * median_j(ln(close_j,t+h/close_j,t)))
    exits:
      hard_horizon_bars: 6
      catchup_complete: 'catch_h >= 0.75 * g0'
      adverse_widening: 'catch_h <= -0.50 * g0'

spot_exit_risk_estimand:
  precondition: standardized_long_inventory_exists
  inventory_notional_usdt: 100
  action_at_alert: sell_at_next_executable_bid
  action_at_family_exit: rebuy_at_next_executable_ask
  incremental_net_utility: >-
    terminal wealth of exit-and-rebuy path minus terminal wealth of uninterrupted
    long inventory, including the two additional fee and slippage legs.
  no_inventory_behavior: alert_only_no_synthetic_short

