    First 00:00 UTC after (i) external timestamp of signed specification, code,
    configuration, schema, container and source hashes; (ii) 30 consecutive days of
    required-stream coverage >= 99.9%; and (iii) zero open P0 or P1 defects.
  operational_visibility_during_holdout:
    allowed:
      - data_coverage
      - parser_and_sequence_health
      - duplicate_and_outbox_metrics
      - resource_bounds
    forbidden:
      - labels
      - family_or_sleeve_PnL
