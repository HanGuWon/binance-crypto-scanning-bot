non_overlapping_portfolio:
  family_risk_budget_each: 0.3333333333
  one_position_per_venue_symbol: true
  repeat_signal_policy: ignore_until_flat_plus_one_closed_5m_cooldown
  same_symbol_same_direction_across_families: aggregate_not_duplicate
