# PROSPECTIVE CAMPAIGN PREREGISTRATION DRAFT — NOT REGISTERED / NOT ACTIVATED
#
# campaign_id and source_identity MUST be finalized at deployment time:
#   - source_identity = freeze_source(default_source_root()).source_identity
#   - campaign_created_at_ms = actual registration time
#   - activation_ms = clean future UTC boundary AFTER preflight (must be
#     explicitly filled in the deployment copy; never a past time)
#
# All scientific parameters are copied EXACTLY from the qualified Phase F
# smoke configuration. No tuning is permitted.

app_name: binance-signal-bot-prospective-phase-g
log_level: INFO
rule_version: v4.3.0-causal-structure-diagnostics

binance:
  markets: [spot, futures]
  quote_asset: USDT
  top_n: 20
  surveillance_n: 200
  min_quote_volume: 50000000
  minimum_age_days: 30
  intervals: [1m, 5m, 15m, 1h, 4h]
  primary_interval: 5m
  bootstrap_candles: 260
  history_limit: 600
  websocket_batch_size: 180
  max_connection_age_seconds: 85800
  rest_concurrency: 5
  request_timeout_seconds: 15
  funding_history_points: 256
  funding_refresh_seconds: 300
  universe_refresh_seconds: 900
  universe_change_confirmations: 2
  blacklist: []
  excluded_base_assets: [USDC, FDUSD, USDP, TUSD, DAI, EUR, TRY, BRL]

signals:
  watch_score: 60
  setup_score: 70
  confirmed_score: 80
  cooldown_seconds: 1800
  maximum_spread_bps: 15
  overbought_rsi: 75
  oversold_rsi: 25
  relative_volume_threshold: 1.8
  breakout_lookback: 20
  squeeze_percentile: 15
  anomaly_horizon_seconds: 30
  anomaly_min_absolute_return: 0.015
  anomaly_robust_zscore: 4.0
  anomaly_min_points: 20
  anomaly_history_points: 600
  anomaly_min_quote_volume_usdt: 10000000
  gate_enabled: true
  entry_policy: r2_pit_htf_exec
  execution_notional_usdt: 100.0
  trend_gate: 60
  participation_gate: 60
  crowding_risk_cap: 75
  execution_gate: 65
  completeness_gate: 95
  book_maximum_age_ms: 2000
  funding_maximum_age_ms: 32400000
  funding_zscore_lookback_ms: 2592000000
  funding_zscore_minimum_history: 20
  gate_use_participation: false
  gate_use_crowding: false
  gate_use_higher_timeframes: true
  confirmation_mode: explicit_trigger
  volume_feature_set: none
  volume:
    taker_short_bars: 3
    taker_long_bars: 12
    taker_short_threshold: 0.10
    vpci_short_window: 5
    vpci_long_window: 20
    vpci_atr_window: 20
    vpci_signal_window: 5
    vpci_slope_lag: 3
  pullback_alert_mode: informational
  pullback_intervals: [5m, 15m, 1h, 4h]
  technical_exit:
    enabled: true
    trend_failure_bars: 3
    trailing_activation_r: 1.0
    trailing_atr_multiple: 2.0
    max_holding_bars: 72
  reversal_intervals: []

shadow:
  # FILL AT DEPLOYMENT: activation_ms must be set to a future UTC boundary.
  # The Phase-F final v2 smoke did NOT qualify (spot 16 < 18 consecutive
  # cells); this template must only be used from a QUALIFYING smoke source.
  activation_ms: null
  policy_version: er_context_v1
  efficiency_ratio_min: 0.40
  breakout_max_distance_atr: 0.50
  round_trip_cost_bps: 26.0
  cost_headroom_multiple: 2.0
  require_btc_context_aligned: true
  observation_enabled: false
  observation_schema_version: shadow_observation_v2
  campaign_schema_version: shadow_campaign_v1
  campaign_mode: prospective
  # FILL AT DEPLOYMENT (preregistration). Validation with null
  # source_identity requires retest_observation_enabled: false; the
  # deployment copy must set the real identity and re-enable retests.
  campaign_id: null
  source_identity: null
  campaign_created_at_ms: null
  retest_observation_enabled: false
  retest_horizon_bars: 72

storage:
  # FILL AT DEPLOYMENT (dedicated DB path for the prospective campaign):
  url: sqlite:///./var/prospective-causal-retest.db
  echo_sql: false

alerts:
  discord_enabled: false
  discord_webhook_url: null   # provide via environment/secret injection
  discord_username: Binance Signal Bot Prospective
  max_attempts: 3
  timeout_seconds: 10
  outbox_max_active_items: 10000

runtime:
  persist_candles: true
  record_raw_events: true
  raw_event_directory: ./var/raw-events/prospective-causal-retest
  raw_event_max_bytes: 10737418240
